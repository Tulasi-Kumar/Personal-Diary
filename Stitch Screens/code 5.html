  </head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl pt-safe"><div class="h-16 px-margin-mobile flex items-center justify-between"><span class="font-headline-md text-headline-md tracking-normal text-on-surface italic">Home</span><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center" style="background-color: rgb(43, 61, 84);"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 bg-surface px-margin-mobile pb-space-xl"><div class="flex flex-col w-full relative">
<!-- Minimalist Journal Header / Date Marker -->
<header class="pt-space-lg pb-space-md flex flex-col items-center justify-center text-center">

      Saturday, 7 November
    </time>
<div class="w-8 h-px bg-surface-variant mt-space-sm opacity-60"></div>
</header>
<!-- Writing Canvas / Blank Page -->
<section class="flex flex-col w-full px-space-md py-space-sm">
<div class="relative w-full">
<!-- Hidden Interactive Textarea overlaid for natural keyboard input -->
<textarea class="w-full bg-transparent resize-none border-none outline-none font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant placeholder:italic leading-loose tracking-wide z-10 relative cursor-text select-text" id="journal-input" placeholder="What happened today?" rows="10" spellcheck="false"></textarea>
<!-- Ambient Bookish Guideline Accent -->
<div class="absolute top-0 left-0 right-0 pointer-events-none opacity-40">
<div class="h-8 border-b border-surface-container"></div>
<div class="h-8 border-b border-surface-container"></div>
<div class="h-8 border-b border-surface-container"></div>
</div>
</div>
</section>
<!-- Serene Breathing Canvas with Tactile Prompt Ephemera -->
<div class="flex flex-col items-center justify-center py-space-xl opacity-40 hover:opacity-80 transition-opacity duration-700 select-none">
<div class="w-1.5 h-1.5 rounded-full bg-primary-container mb-space-xs" style="background-color: rgb(43, 61, 84);"></div>
<span class="font-headline-sm text-headline-sm italic text-tertiary">An unhurried page for your thoughts.</span>
</div>
<!-- Ambient Photo Memory Teaser (Archival Tone) -->
<div class="px-space-md pt-space-xs pb-space-xl">
<div class="p-space-sm bg-surface-container-low rounded-xl flex items-center gap-space-md">
<div class="w-12 h-12 rounded-lg overflow-hidden flex-shrink-0 bg-surface-container">
<img class="w-full h-full object-cover" data-alt="Close up archival photograph of dried autumnal beech leaves resting upon an open linen diary with fountain pen ink marks, bathed in warm afternoon natural window sunlight, soft textures in muted ivory and bronze palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBv8Y1sdeqSeAGzlyKboOeZV8-Ocgr1tJZQcd3v6XO9eKAFiQ5V1-WIO98XFmatvpGbIekQY2r6ZkAuhsXHzgyPHX5ExZ1p_GsNJs5zcYXAaw3Gx5eoB-END--iDLCxzx98PkCFu17SiaJUyBbzU3K3uYjXGv-RpbssewFuPpZsf2fxwd0prR6i4outsv36J-l4SY_Y53cV_NbvDW1Ky0nSmiusADa_1HZtgUQ09Q">
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-outline">Earlier Today</span>
<span class="font-body-sm text-body-sm text-on-surface truncate">Morning rain against the cedar shingles</span>
</div>
<span class="material-symbols-outlined text-secondary text-[18px] ml-auto">north_east</span>

<!-- Media Tools -->
<div class="flex items-center gap-space-sm">
<button aria-label="Write Text" class="w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">ink_pen</span>
</button>
<button aria-label="Record Voice Memory" class="w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">mic</span>
</button>
<button aria-label="Attach Photograph" class="w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">photo_camera</span>
</button>

</button>
</div>
<div class="h-4 w-px bg-outline-variant mx-1"></div>
<!-- Understated Add Action -->
<button class="font-label-md text-label-md uppercase tracking-wider text-on-surface hover:text-primary-container px-space-xs py-1 transition-colors flex items-center gap-1" id="save-action" type="button" style="color: rgb(43, 61, 84);">
<span class="">Add</span>
<span class="material-symbols-outlined text-[14px]">arrow_upward</span>
</button>
</div>
</div>
</div>
<script>
  (function() {
    const input = document.getElementById('journal-input');
    const saveBtn = document.getElementById('save-action');

    if (input) {
      input.addEventListener('focus', function() {
        this.parentElement.classList.add('transition-all');
      });

      // Auto expand as user reflects and pens thoughts
      input.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
      });
    }

    if (saveBtn && input) {
      saveBtn.addEventListener('click', function() {
        if (input.value.trim().length > 0) {
          const originalText = saveBtn.innerText;
          saveBtn.innerText = 'Saved';
          setTimeout(() => {
            saveBtn.innerHTML = '<span>Add</span><span class="material-symbols-outlined text-[14px]">arrow_upward</span>';
          }, 1800);
        } else {
          input.focus();
        }
      });
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/95 backdrop-blur-xl shadow-[0_-1px_0_rgba(213,195,183,0.35)]" data-active-classes="text-primary-container"><div class="flex justify-around items-center h-16 px-space-xs"><a aria-current="page" class="flex flex-col items-center justify-center w-16 h-12 transition-colors text-primary-container" data-path="home" href="#" style="color: rgb(43, 61, 84);"><span class="material-symbols-outlined text-[22px]">edit_note</span><span class="font-label-sm text-label-sm uppercase tracking-wider mt-0.5">Home</span></a><a class="flex flex-col items-center justify-center w-16 h-12 text-on-surface-variant transition-colors" data-path="calendar" href="#"><span class="material-symbols-outlined text-[22px]">calendar_today</span><span class="font-label-sm text-label-sm uppercase tracking-wider mt-0.5">Calendar</span></a><a class="flex flex-col items-center justify-center w-16 h-12 text-on-surface-variant transition-colors" data-path="memories" href="#"><span class="material-symbols-outlined text-[22px]">auto_stories</span><span class="font-label-sm text-label-sm uppercase tracking-wider mt-0.5">Memories</span></a><a class="flex flex-col items-center justify-center w-16 h-12 text-on-surface-variant transition-colors" data-path="profile" href="#"><span class="material-symbols-outlined text-[22px]">spa</span><span class="font-label-sm text-label-sm uppercase tracking-wider mt-0.5">Profile</span></a></div></nav>
