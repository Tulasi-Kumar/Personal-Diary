<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "secondary-fixed-dim": "#cfc5be", "tertiary-fixed": "#eee0d7", "on-secondary-fixed-variant": "#4c4641", "on-primary": "#ffffff", "surface": "#fdf9f1", "on-error-container": "#93000a", "outline-variant": "#d5c3b7", "on-error": "#ffffff", "tertiary-fixed-dim": "#d1c4bb", "surface-tint": "#80552b", "primary": "#7e5329", "secondary": "#645d58", "primary-fixed-dim": "#f5bb88", "surface-container": "#f1ede6", "surface-container-lowest": "#ffffff", "on-secondary-fixed": "#1f1b17", "on-surface": "#1c1c17", "secondary-fixed": "#ebe0da", "inverse-primary": "#f5bb88", "surface-bright": "#fdf9f1", "on-primary-container": "#fffcff", "background": "#fdf9f1", "on-primary-fixed": "#2d1600", "surface-variant": "#e6e2da", "inverse-surface": "#31302b", "surface-container-highest": "#e6e2da", "on-secondary": "#ffffff", "surface-container-high": "#ece8e0", "surface-container-low": "#f7f3eb", "outline": "#83746a", "tertiary": "#645b54", "on-primary-fixed-variant": "#653e16", "error": "#ba1a1a", "on-tertiary-fixed-variant": "#4e453f", "inverse-on-surface": "#f4f0e8", "primary-container": "#9a6b3f", "on-background": "#1c1c17", "on-tertiary-container": "#fffdff", "error-container": "#ffdad6", "on-tertiary": "#ffffff", "surface-dim": "#dddad2", "on-surface-variant": "#50453b", "secondary-container": "#e8ded7", "on-secondary-container": "#68615c", "primary-fixed": "#ffdcc0", "on-tertiary-fixed": "#211a15", "tertiary-container": "#7e736c" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-sm": "0.5rem", "margin-mobile": "1.25rem", "space-xs": "0.25rem", "gutter-mobile": "0.75rem", "margin": "2rem", "gutter": "1rem", "space-lg": "1.5rem", "space-xl": "2.5rem", "space-md": "1rem" }, "fontFamily": { "label-sm": ["Inter"], "label-lg": ["Inter"], "headline-sm": ["EB Garamond"], "body-md": ["EB Garamond"], "display": ["EB Garamond"], "display-mobile": ["EB Garamond"], "headline-md": ["EB Garamond"], "headline-lg": ["EB Garamond"], "body-lg": ["EB Garamond"], "label-md": ["Inter"], "body-sm": ["EB Garamond"] }, "fontSize": { "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.1em", "fontWeight": "600" }], "label-lg": ["13px", { "lineHeight": "18px", "letterSpacing": "0.06em", "fontWeight": "500" }], "headline-sm": ["19px", { "lineHeight": "26px", "letterSpacing": "0em", "fontWeight": "500" }], "body-md": ["17px", { "lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "400" }], "display": ["38px", { "lineHeight": "46px", "letterSpacing": "-0.01em", "fontWeight": "400" }], "display-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "30px", "letterSpacing": "0em", "fontWeight": "500" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "0em", "fontWeight": "400" }], "body-lg": ["19px", { "lineHeight": "32px", "letterSpacing": "0.01em", "fontWeight": "400" }], "label-md": ["11px", { "lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "500" }], "body-sm": ["15px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }] } } } };</script><style>

  </head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface px-margin-mobile"><div class="flex flex-col w-full relative min-h-[777px] overflow-hidden select-none -mx-margin-mobile px-margin-mobile py-space-md justify-between" id="replay-container">
<!-- Cinematic Full-Bleed Atmospheric Background Layer -->
<div class="absolute inset-0 z-0 overflow-hidden">
<video autoplay="" loop="" muted="" playsinline="" class="w-full h-full object-cover transition-opacity duration-700 pointer-events-none" id="cinematic-video" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video>
<!-- Editorial Scrim / Papercraft Shadow Tone Gradients -->
<div class="absolute inset-0 bg-gradient-to-b from-on-surface/75 via-transparent to-on-surface/90 pointer-events-none"></div>
<div class="absolute inset-0 bg-primary/10 mix-blend-multiply pointer-events-none"></div>
</div>
<!-- Top Cinematic Controls Header -->
<div class="relative z-10 w-full flex flex-col gap-space-sm pt-space-xs">
<!-- Story Progress Bars (Hairline segments, no borders) -->
<div class="w-full flex items-center gap-2 px-space-xs pt-1"><span class="text-[11px] font-mono text-tertiary-fixed/80 tracking-wider select-none">00:04</span><div class="flex-1 h-1 bg-surface-container-lowest/30 rounded-full overflow-hidden relative cursor-pointer"><div class="h-full bg-primary-fixed rounded-full w-2/5 transition-all duration-300"></div></div><span class="text-[11px] font-mono text-tertiary-fixed/60 tracking-wider select-none">00:18</span></div>
<!-- Metadata & Controls Floating Row -->
<div class="flex items-center justify-between px-space-xs pt-space-xs"><div class="flex items-center gap-1.5"><button aria-label="Toggle ambient soundtrack" class="flex items-center gap-1.5 py-1 px-2 rounded-full bg-on-surface/20 backdrop-blur-sm active:scale-95 transition-all text-on-primary" id="sound-toggle" type="button"><span class="material-symbols-outlined text-[15px] leading-none text-primary-fixed" id="sound-icon" style="color: rgb(181, 200, 228);">graphic_eq</span><span class="font-label-sm text-label-sm uppercase tracking-widest text-surface-container-lowest/90" id="sound-label">Music on</span></button><div class="flex items-center gap-1 py-1 px-2 rounded-full bg-on-surface/20 backdrop-blur-sm text-surface-container-lowest/90"><span class="material-symbols-outlined text-[14px] leading-none text-primary-fixed" style="color: rgb(181, 200, 228);">videocam</span><span class="font-label-sm text-label-sm uppercase tracking-widest">Video Reel · 1080p</span></div></div><div class="flex items-center gap-1 opacity-90"><span class="font-headline-sm text-headline-sm italic text-surface-container-lowest font-normal tracking-wide">Made from your day</span></div><button aria-label="Exit cinematic replay" class="w-8 h-8 flex items-center justify-center rounded-full bg-on-surface/20 backdrop-blur-sm text-surface-container-lowest hover:bg-on-surface/35 active:scale-90 transition-all" id="close-button" type="button"><span class="material-symbols-outlined text-[17px] leading-none">close</span></button></div>
</div>
<!-- Interactive Story Touch Surface Zones -->
<div class="absolute inset-0 z-10 flex flex-col justify-between pointer-events-auto"><div class="w-full flex-1 grid grid-cols-2"><div aria-label="Previous story moment" class="h-full w-full cursor-pointer" id="touch-prev"></div><div aria-label="Next story moment" class="h-full w-full cursor-pointer" id="touch-next"></div></div><div class="absolute inset-0 flex items-center justify-center pointer-events-none"><div class="w-14 h-14 rounded-full bg-on-surface/30 backdrop-blur-sm flex items-center justify-center text-surface-container-lowest opacity-0 transition-opacity duration-300 shadow-sm" id="play-pause-indicator"><span class="material-symbols-outlined text-[28px] leading-none" id="play-pause-icon">pause</span></div></div></div>
<!-- Bottom Literary Verse & Timeless Date Stamp -->
<div class="relative z-10 flex flex-col items-center text-center pb-space-lg px-space-sm max-w-lg mx-auto pointer-events-none"><blockquote class="font-headline-lg text-headline-lg text-surface-container-lowest font-normal leading-relaxed tracking-normal px-space-md mb-space-sm drop-shadow-sm select-text transition-opacity duration-700" id="quote-line">“The aroma of fresh filter coffee and roasted cardamom lingered by the veranda, and Bangalore felt gently quiet.”</blockquote><div class="flex items-center gap-2 mb-space-md"><span class="font-label-md text-label-md uppercase tracking-widest text-tertiary-fixed font-medium">28 October · Friday</span><span class="text-tertiary-fixed/60 font-body-sm text-body-sm italic">—</span><span class="font-label-md text-label-md uppercase tracking-wider text-tertiary-fixed/80">Gulmohar Lane, 18:42</span></div><div class="w-full max-w-xs flex items-center justify-between gap-3 px-3 py-1.5 rounded-full bg-on-surface/30 backdrop-blur-sm pointer-events-auto shadow-sm"><button aria-label="Play or pause video" class="w-7 h-7 flex items-center justify-center rounded-full text-surface-container-lowest hover:bg-on-surface/40 active:scale-95 transition-all" type="button"><span class="material-symbols-outlined text-[18px] leading-none">pause</span></button><div class="flex-1 flex items-center gap-2"><span class="font-mono text-[11px] text-tertiary-fixed">0:04</span><div class="flex-1 h-1 bg-surface-container-lowest/30 rounded-full overflow-hidden relative"><div class="h-full bg-primary-fixed rounded-full w-1/3"></div></div><span class="font-mono text-[11px] text-tertiary-fixed/70">0:18</span></div><button aria-label="Video settings" class="w-7 h-7 flex items-center justify-center rounded-full text-surface-container-lowest hover:bg-on-surface/40 active:scale-95 transition-all" type="button"><span class="material-symbols-outlined text-[16px] leading-none">volume_up</span></button></div></div>
</div>
<script>
  (function() {
    const bgElement = document.getElementById('cinematic-bg');
    const soundToggle = document.getElementById('sound-toggle');
    const soundIcon = document.getElementById('sound-icon');
    const soundLabel = document.getElementById('sound-label');
    const closeBtn = document.getElementById('close-button');
    const replayContainer = document.getElementById('replay-container');

    // Subtle slow Ken Burns zoom trigger
    if (bgElement) {
      requestAnimationFrame(() => {
        bgElement.classList.remove('scale-105');
        bgElement.classList.add('scale-115');
      });
    }

    // Toggle ambient score
    let isPlaying = true;
    if (soundToggle) {
      soundToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        isPlaying = !isPlaying;
        if (isPlaying) {
          soundIcon.textContent = 'graphic_eq';
          soundLabel.textContent = 'Music on';
          soundToggle.classList.remove('opacity-60');
        } else {
          soundIcon.textContent = 'volume_off';
          soundLabel.textContent = 'Muted';
          soundToggle.classList.add('opacity-60');
        }
      });
    }

    // Gentle exit transition
    if (closeBtn && replayContainer) {
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        replayContainer.style.transition = 'opacity 0.4s ease-out';
        replayContainer.style.opacity = '0';
        setTimeout(() => {
          if (window.history.length > 1) {
            window.history.back();
          }
        }, 400);
      });
    }
  })();
</script></main>
