  </head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl pt-safe"><div class="h-16 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-sm"><button class="w-11 h-11 flex items-center justify-center text-on-surface-variant hover:text-on-surface -ml-2 rounded-full" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface italic truncate">Day</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center" style="background-color: rgb(43, 61, 84);"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface px-margin-mobile"><div class="flex flex-col w-full pb-24">
<!-- Marginalia / Chronological Breadcrumb Bar -->
<div class="flex items-center justify-between py-space-sm mb-space-md">
<div class="flex flex-col">
<div class="flex items-center gap-space-xs text-on-surface">
<span class="material-symbols-outlined text-[15px] text-primary" style="color: rgb(43, 61, 84);">history</span>
<h2 class="font-headline-sm text-headline-sm font-medium tracking-tight">Tuesday, 3 November</h2>
</div>
<p class="font-body-sm text-body-sm italic text-primary-container mt-0.5" style="color: rgb(43, 61, 84);">Adding to a past day</p>
</div>
<!-- Retroactive Mood / Weather Capsule -->
<div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container text-on-surface-variant">
<span class="material-symbols-outlined text-[15px] text-primary" style="color: rgb(43, 61, 84);">wb_cloudy</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-secondary" style="color: rgb(43, 61, 84);">Autumn • 14°</span>
</div>
</div>
<!-- Primary Journaling Canvas -->
<div class="relative w-full rounded-xl bg-surface-container-low p-space-lg shadow-sm flex flex-col min-h-[380px]">
<!-- Ambient Archival Bookmark Ribbon Stamp -->
<div class="flex items-center justify-between text-outline-variant mb-space-md select-none">
<div class="flex items-center gap-2">
<span class="font-label-sm text-label-sm uppercase text-secondary">Entry N° 182</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">4 weeks ago</span>
</div>
<span class="font-body-sm text-body-sm italic text-tertiary">Archived recollection</span>
</div>
<!-- Editable Text Area Simulator -->
<div class="relative flex-1 cursor-text" id="editorContainer" onclick="focusEditor()">
<div class="font-headline-md text-headline-md text-on-surface leading-relaxed min-h-[220px] whitespace-pre-wrap outline-none selection:bg-primary-fixed" id="contentDisplay"></div>
<!-- Literary Prompt Placeholder & Blinking Hairline Ink Cursor -->
<div class="absolute top-0 left-0 right-0 pointer-events-none flex items-start gap-0.5" id="placeholderWrap">
<p class="font-headline-md text-headline-md font-normal italic text-on-surface-variant/50">
          What happened on this day?
        </p>
<span class="inline-block w-[1.5px] h-6 bg-on-surface animate-pulse ml-0.5 mt-1" id="inkCaret"></span>
</div>
<!-- Hidden Actual Textarea for Native Touch Keyboards -->
<textarea aria-label="Journal entry content" class="opacity-0 absolute inset-0 w-full h-full resize-none pointer-events-auto cursor-text z-10" id="hiddenInput"></textarea>
</div>
<!-- Visual Memory Memento Tray (Collapsible Past Ephemera) -->
<div class="mt-space-lg pt-space-md border-t border-outline-variant/30 flex items-center justify-between">
<div class="flex items-center gap-space-sm">
<div class="w-9 h-9 rounded-lg bg-surface-container-high overflow-hidden relative flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="A vintage 35mm film photograph of late autumn leaves resting on weathered stone steps, bathed in soft golden afternoon light with rich sepia and terracotta tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCHGTw5ADujS5XiMig4eQ2oeLSu1yPw52pyBHQe6CxHRYDQk5IqCwG8loFAoKU5L7NtN5lzL7p5Tw32rjx_j_a9Epc0aY1DqMWzGmu7Wmgz_xWcMootZ61inPBRycGQSDdr8cbDl54OlqPTBY7SUVGny1ObvjB5moUqkVlKTfolNEfPO63Paf_VKjlVsCHzs_Kcuemulqj-S98wKCE7T_a4Lz7xFNvLHCGeVixbGw">
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface">3:42 PM • Rain in the garden</span>
<span class="font-body-sm text-body-sm text-secondary italic">1 photo attached</span>
</div>
</div>
<button class="w-7 h-7 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]" style="color: rgb(43, 61, 84);">expand_more</span>
</button>
</div>
</div>
<!-- Reflection Inspiration Chips -->
<div class="mt-space-md mb-space-sm flex items-center gap-2 overflow-x-auto py-1 no-scrollbar">
<button class="flex-shrink-0 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant hover:bg-secondary-container transition-colors font-body-sm text-body-sm italic" onclick="insertPrompt('The evening chai conversation... ')" type="button">“The evening chai conversation...”</button>
<button class="flex-shrink-0 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant hover:bg-secondary-container transition-colors font-body-sm text-body-sm italic" onclick="insertPrompt('Walking through the bazaar at dusk... ')" type="button">“Walking through the bazaar at dusk...”</button>
<button class="flex-shrink-0 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant hover:bg-secondary-container transition-colors font-body-sm text-body-sm italic" onclick="insertPrompt('Looking back now, ')" type="button">
      “Looking back now...”
    </button>
</div>
<!-- Floating Capture Capsule & Bottom Navigation Bar -->
<div class="fixed bottom-0 left-0 right-0 z-40 bg-surface/95 backdrop-blur-md px-margin-mobile pb-safe">
<!-- Bottom Capture Toolbar Capsule -->
<div class="w-full max-w-md mx-auto mb-2 bg-surface-container-lowest rounded-full p-1.5 shadow-md flex items-center justify-between">
<div class="flex items-center gap-1 pl-2">
<!-- Type Tool -->
<button aria-label="Keyboard input" class="w-10 h-10 rounded-full flex items-center justify-center text-primary bg-primary-fixed/40 transition-colors" type="button" style="background-color: rgb(230, 236, 245); color: rgb(43, 61, 84);">
<span class="material-symbols-outlined text-[20px]">keyboard</span>
</button>
<!-- Voice Memo -->
<button aria-label="Audio recollection" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">mic</span>
</button>
<!-- Past Photo -->
<button aria-label="Attach photo" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">photo_library</span>
</button>
<!-- Video Fragment -->
<button aria-label="Attach motion" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">videocam</span>
</button>
</div>
<!-- Save / Add Action Pill -->
<button class="px-5 py-2.5 rounded-full bg-primary text-on-primary font-label-lg text-label-lg uppercase tracking-wider flex items-center gap-1.5 active:scale-95 transition-all" id="saveButton" type="button" style="background-color: rgb(43, 61, 84); color: rgb(255, 255, 255);">
<span class="">Save</span>
<span class="material-symbols-outlined text-[16px]">check</span>
</button>
</div>
<!-- Quiet Contextual Chronological Bar (Calendar Anchored) -->
<div class="w-full max-w-md mx-auto h-12 flex items-center justify-around text-secondary">
<button class="flex flex-col items-center gap-0.5 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]">auto_stories</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<!-- Active Day / Calendar context -->
<button class="flex flex-col items-center gap-0.5 text-primary" type="button" style="color: rgb(43, 61, 84);">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
<span class="font-label-sm text-label-sm font-semibold">Past Day</span>
<span class="w-1 h-1 rounded-full bg-primary -mt-0.5" style="background-color: rgb(43, 61, 84);"></span>
</button>
<button class="flex flex-col items-center gap-0.5 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]">history_edu</span>
<span class="font-label-sm text-label-sm">Memories</span>
</button>
<button class="flex flex-col items-center gap-0.5 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]">person_outline</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</div>
</div>
</div>
<script>
  const hiddenInput = document.getElementById('hiddenInput');
  const contentDisplay = document.getElementById('contentDisplay');
  const placeholderWrap = document.getElementById('placeholderWrap');
  const saveButton = document.getElementById('saveButton');

  function focusEditor() {
    if (hiddenInput) {
      hiddenInput.focus();
    }
  }

  function insertPrompt(text) {
    if (hiddenInput) {
      hiddenInput.value = (hiddenInput.value ? hiddenInput.value + ' ' : '') + text;
      handleInput();
      hiddenInput.focus();
    }
  }

  function handleInput() {
    const val = hiddenInput.value;
    contentDisplay.textContent = val;
    if (val.trim().length > 0) {
      placeholderWrap.classList.add('hidden');
    } else {
      placeholderWrap.classList.remove('hidden');
    }
  }

  if (hiddenInput) {
    hiddenInput.addEventListener('input', handleInput);
  }

  if (saveButton) {
    saveButton.addEventListener('click', () => {
      saveButton.classList.add('bg-primary-container');
      setTimeout(() => {
        saveButton.classList.remove('bg-primary-container');
      }, 400);
    });
  }
</script></main>



</body></html>
